services:

  backend:
    build: .
    container_name: todo-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: todo-mongo
    ports:
      - "27017:27017"

  frontend:
    build: ../frontend
    container_name: todo-frontend
    ports:
      - "80:80"